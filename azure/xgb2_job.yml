$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
code: ..
command: >-
  PREDS_DIR=./outputs python src/train_gbm.py --algo xgb --name xgb_v2 --sub 0.3 --lr 0.05 --topo2 --dn2 --full
  --no-future-vol --seed 11
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
  conda_file: env.yml
compute: azureml:cpu16
experiment_name: sintef-uc
display_name: xgb_v2_full
